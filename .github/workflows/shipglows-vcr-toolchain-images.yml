name: ShipGlows VCR toolchain images

on:
  push:
    branches:
      - codex/vcr-toolchain-images
    paths:
      - .github/workflows/shipglows-vcr-toolchain-images.yml
      - runner/images/astro-web/**
      - runner/images/flutter-web/**
      - runner/test/fixtures/linux-compilation/astro-web/**
      - runner/test/fixtures/linux-compilation/flutter-web/**

concurrency:
  group: shipglows-vcr-toolchain-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: vcr.vercel.com
  VCR_TEAM_SLUG: diane-ds-projects
  VCR_PROJECT_SLUG: gocharbon_site
  SOURCE_DATE_EPOCH: "0"

jobs:
  build-scan-push:
    if: github.ref == 'refs/heads/codex/vcr-toolchain-images'
    name: ${{ matrix.target }} / linux-amd64
    runs-on: ubuntu-24.04
    environment: vcr-build-proof
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - target: astro-web
            repository: shipglows-astro-web
            context: runner/images/astro-web
            fixture: runner/test/fixtures/linux-compilation/astro-web
          - target: flutter-web
            repository: shipglows-flutter-web
            context: runner/images/flutter-web
            fixture: runner/test/fixtures/linux-compilation/flutter-web

    steps:
      - name: Checkout immutable source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/vcr-toolchain-images"
          test "$VCR_TEAM_SLUG" = "diane-ds-projects"
          test "$VCR_PROJECT_SLUG" = "gocharbon_site"
          mkdir -p evidence

      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.36.1
          install: true

      - name: Build one attested OCI layout
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          build-contexts: |
            fixture=${{ matrix.fixture }}
          platforms: linux/amd64
          tags: shipglows-layout/${{ matrix.target }}:${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: mode=max
          outputs: type=oci,dest=${{ runner.temp }}/shipglows-${{ matrix.target }}-${{ github.sha }}-oci,tar=false,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true,rewrite-timestamp=true

      - name: Bind layout, digest, platform, SBOM and provenance
        id: artifact
        shell: bash
        env:
          BUILDX_DIGEST: ${{ steps.build.outputs.digest }}
          OCI_LAYOUT: ${{ runner.temp }}/shipglows-${{ matrix.target }}-${{ github.sha }}-oci
        run: |
          set -euo pipefail
          test -s "$OCI_LAYOUT/index.json"
          cp "$OCI_LAYOUT/index.json" evidence/index-${{ matrix.target }}.json
          root_digest="$(jq -er 'if (.manifests | length) == 1 then .manifests[0].digest else error("expected one OCI root descriptor") end' evidence/index-${{ matrix.target }}.json)"
          [[ "$root_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$root_digest" = "$BUILDX_DIGEST"
          root_hex="${root_digest#sha256:}"
          cp "$OCI_LAYOUT/blobs/sha256/$root_hex" evidence/root-manifest-${{ matrix.target }}.json
          test "$(sha256sum evidence/root-manifest-${{ matrix.target }}.json | cut -d' ' -f1)" = "$root_hex"
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1' evidence/root-manifest-${{ matrix.target }}.json >/dev/null
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 1' evidence/root-manifest-${{ matrix.target }}.json >/dev/null
          layout_sha256="$(cd "$OCI_LAYOUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "layout=$OCI_LAYOUT" >> "$GITHUB_OUTPUT"
          echo "layout_sha256=$layout_sha256" >> "$GITHUB_OUTPUT"
          echo "root_digest=$root_digest" >> "$GITHUB_OUTPUT"
          echo "scan_ref=$OCI_LAYOUT@$root_digest" >> "$GITHUB_OUTPUT"

      - name: Scan exact OCI layout digest before registry access
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          input: ${{ steps.artifact.outputs.scan_ref }}
          format: json
          output: evidence/trivy-${{ matrix.target }}.json
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          cache: false

      - name: Bind successful scan to the OCI digest
        shell: bash
        env:
          LAYOUT_SHA256: ${{ steps.artifact.outputs.layout_sha256 }}
          ROOT_DIGEST: ${{ steps.artifact.outputs.root_digest }}
        run: |
          set -euo pipefail
          test -s "evidence/trivy-${{ matrix.target }}.json"
          jq -e '.SchemaVersion >= 2 and (.Results | type == "array")' "evidence/trivy-${{ matrix.target }}.json" >/dev/null
          scan_sha256="$(sha256sum evidence/trivy-${{ matrix.target }}.json | cut -d' ' -f1)"
          jq -n \
            --arg layoutSha256 "$LAYOUT_SHA256" \
            --arg rootDigest "$ROOT_DIGEST" \
            --arg scanSha256 "$scan_sha256" \
            '{schemaVersion:"shipglows-vcr-scan-binding-v1",layoutSha256:$layoutSha256,rootDigest:$rootDigest,scanEngine:"trivy-v0.74.0",scanResultSha256:$scanSha256,result:"high-critical-zero"}' \
            > "evidence/scan-binding-${{ matrix.target }}.json"

      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.3

      - name: Authenticate to project-scoped VCR
        shell: bash
        env:
          VCR_OIDC_TOKEN: ${{ secrets.VCR_OIDC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VCR_OIDC_TOKEN"
          printf '%s' "$VCR_OIDC_TOKEN" | docker login "$REGISTRY" --username oidc --password-stdin

      - name: Enforce immutable destination tag
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$REGISTRY/$VCR_TEAM_SLUG/$VCR_PROJECT_SLUG/${{ matrix.repository }}:$GITHUB_SHA"
          if oras resolve "$image_ref" >/dev/null 2>&1; then
            echo "::error::Immutable VCR tag already exists: $image_ref"
            exit 1
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Copy the scanned OCI digest without rebuilding
        id: push
        shell: bash
        env:
          IMAGE_REF: ${{ steps.destination.outputs.image_ref }}
          OCI_LAYOUT: ${{ steps.artifact.outputs.layout }}
          ROOT_DIGEST: ${{ steps.artifact.outputs.root_digest }}
        run: |
          set -euo pipefail
          oras cp --from-oci-layout "$OCI_LAYOUT@$ROOT_DIGEST" "$IMAGE_REF"
          remote_digest="$(oras resolve "$IMAGE_REF")"
          test "$remote_digest" = "$ROOT_DIGEST"
          oras manifest fetch --output "evidence/remote-root-manifest-${{ matrix.target }}.json" "$IMAGE_REF@$ROOT_DIGEST"
          test "sha256:$(sha256sum evidence/remote-root-manifest-${{ matrix.target }}.json | cut -d' ' -f1)" = "$ROOT_DIGEST"
          echo "digest=$ROOT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Record immutable proof
        id: evidence
        shell: bash
        env:
          IMAGE_REF: ${{ steps.destination.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          LAYOUT_SHA256: ${{ steps.artifact.outputs.layout_sha256 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg target "${{ matrix.target }}" \
            --arg image "$IMAGE_REF" \
            --arg digest "$IMAGE_DIGEST" \
            --arg layoutSha256 "$LAYOUT_SHA256" \
            --arg source "$GITHUB_SHA" \
            '{schemaVersion:"shipglows-vcr-build-proof-v1",target:$target,image:$image,digest:$digest,layoutSha256:$layoutSha256,sourceRevision:$source,platform:"linux/amd64",compression:"zstd",sbom:true,provenance:"mode=max",scan:"trivy-high-critical-zero",transport:"oras-copy-no-rebuild"}' \
            > "evidence/proof-${{ matrix.target }}.json"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.target }}"
            echo "\`${IMAGE_REF}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable proof bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vcr-proof-${{ matrix.target }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Remove registry credentials
        if: always()
        shell: bash
        run: docker logout "$REGISTRY" >/dev/null 2>&1 || true
