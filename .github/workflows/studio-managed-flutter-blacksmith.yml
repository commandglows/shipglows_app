name: Studio Managed Flutter Compilation
run-name: studio-managed-${{ inputs.operation_id }}-${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Opaque Runner operation identifier
        required: true
        type: string
      source_sha:
        description: Exact repository revision
        required: true
        type: string
      target:
        description: Closed compilation target
        required: true
        type: choice
        options:
          - flutterAndroid
          - flutterWindows

permissions:
  contents: read

concurrency:
  group: studio-managed-${{ inputs.operation_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: runner/test/fixtures/studio_managed_flutter

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.closed.outputs.source_sha }}
    steps:
      - id: closed
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$OPERATION_ID" =~ ^[A-Za-z0-9_-]{8,64}$ ]] || exit 2
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  android:
    needs: validate
    if: inputs.target == 'flutterAndroid'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get
      - working-directory: ${{ env.PROJECT_PATH }}
        run: flutter test
      - working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build apk --debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-${{ inputs.operation_id }}-android
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: validate
    if: inputs.target == 'flutterWindows'
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get
      - working-directory: ${{ env.PROJECT_PATH }}
        run: flutter test
      - working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path $env:PROJECT_PATH/build/windows/x64/runner/Release/* -DestinationPath studio-windows.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-${{ inputs.operation_id }}-windows
          path: studio-windows.zip
          if-no-files-found: error
          retention-days: 1
