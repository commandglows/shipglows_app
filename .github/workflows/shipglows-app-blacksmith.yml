name: ShipGlows App - Android and Windows
run-name: shipglows-app-${{ inputs.target || 'checks' }}-${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        options:
          - android
          - windows
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/shipglows-app-blacksmith.yml"

permissions:
  contents: read

concurrency:
  group: shipglows-app-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'checks' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    if: github.event_name == 'pull_request' || inputs.target == 'android'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shipglows-app-android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'windows'
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath shipglows-app-windows.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shipglows-app-windows-${{ github.sha }}
          path: shipglows-app-windows.zip
          if-no-files-found: error
          retention-days: 1
